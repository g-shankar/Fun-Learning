name: FunLearning
options:
  bundleIdPrefix: com.funlearning
  deploymentTarget:
    iOS: "17.0"

targets:
  FunLearning:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FunLearning
        excludes:
          - "Resources"
          - "Art"
    resources:
      - FunLearning/Resources
    info:
      path: FunLearning/Info.plist
    settings:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: FunLearning
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
